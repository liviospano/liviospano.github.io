/* INTRO */
#intro {
  position:fixed;
  inset:0;
  height:100vh;
  height:100svh;
  min-height:520px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  box-sizing:border-box;
  padding:70px 20px 72px;

.intro-content {
  width:100%;
  max-width:960px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-sizing:border-box;
}

.signature {
  display:block;
  width:min(76vw, 640px);
  max-width:100%;
  height:auto;
  object-fit:contain;
  filter:invert(1);
  opacity:0;
  margin:0;
  animation:fadeIn 1.3s forwards, fadeOut 1.1s forwards 2.7s;
}

.signature-subtitle {
  margin:18px 20px 0;
  max-width:700px;
  font-size:clamp(12px, 14px, 17px);
  line-height:1.5;
  letter-spacing:0.5px;
  font-style:italic;
  font-weight:normal;
  color:rgba(255,255,255,0.78);
  opacity:0;
  animation:subtitleFadeIn 1.3s forwards, subtitleFadeOut 1.1s forwards 2.7s;
}

@keyframes fadeIn {
  to {
    opacity:1;
  }
}

@keyframes fadeOut {
  to {
    opacity:0;
  }
}

@keyframes subtitleFadeIn {
  from {
    opacity:0;
    transform:translateY(8px);
  }

  to {
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes subtitleFadeOut {
  to {
    opacity:0;
  }
}

/* FOOTER */
.global-footer {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;

/* MOBILE MENU */

    padding:0;

    color:white;

  }

    background:white;
  }

  .mobile-nav-menu {

    top:44px;
    left:0;
    right:0;
    z-index:1001;
    display:none;

    box-sizing:border-box;
    background:rgba(0,0,0,0.94);

<script>
function getMobileNavElements(){
  return {
    toggle: document.getElementById("mobile-nav-toggle"),
    menu: document.getElementById("mobile-nav-menu")
  };
}

function setMobileMenuOpen(isOpen){
  const nav = getMobileNavElements();
  if (!nav.toggle || !nav.menu) return;

  nav.toggle.setAttribute("aria-expanded", String(isOpen));
  nav.menu.hidden = !isOpen;
  nav.menu.classList.toggle("is-open", isOpen);
}

function closeMobileMenu(){
  setMobileMenuOpen(false);
}

function toggleMobileMenu(){
  const nav = getMobileNavElements();
  if (!nav.toggle || !nav.menu) return;

  setMobileMenuOpen(nav.toggle.getAttribute("aria-expanded") !== "true");
}

function enterWebsite(){
  window.location.href = "others.html";
}

document.addEventListener("DOMContentLoaded", function(){
  setTimeout(enterWebsite, 3800);

  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") === "livio") {
    const link = document.getElementById("private-admin-link");
    if (link) link.style.display = "block";
  }

  document.querySelectorAll("img").forEach(function(img){
    img.setAttribute("draggable", "false");
    img.setAttribute("oncontextmenu", "return false");
  });
});

document.addEventListener("click", function(event){
  const nav = getMobileNavElements();
  if (!nav.toggle || !nav.menu || nav.menu.hidden) return;
  if (nav.toggle.contains(event.target) || nav.menu.contains(event.target)) return;

  closeMobileMenu();
});

document.addEventListener("keydown", function(event){
  if (event.key === "Escape") {
    closeMobileMenu();
  }
});

window.addEventListener("resize", function(){
  if (window.innerWidth > 768) {
    closeMobileMenu();
  }
});

document.addEventListener("contextmenu", function(event){
  if (event.target && event.target.tagName && event.target.tagName.toLowerCase() === "img") {
    event.preventDefault();
  }
});

document.addEventListener("dragstart", function(event){
  if (event.target && event.target.tagName && event.target.tagName.toLowerCase() === "img") {
    event.preventDefault();
  }
});
</script>
