<style>

/* BASE */
body {
  margin:0;
  background: radial-gradient(circle at center, #1c1c1c 0%, #000000 85%);
  color:white;
  font-family:Arial;
}

/* MENU */
nav {
  position:fixed;
  top:0;
  width:100%;
  text-align:center;
  padding:15px;
  background:rgba(0,0,0,0.9);
  z-index:1000;
}

nav a {
  color:white;
  margin:0 15px;
  text-decoration:none;
  font-size:12px;
  cursor:pointer;
  opacity:0.7;
}

nav a:hover { opacity:1; }

.mobile-nav-toggle,
.mobile-nav-menu {
  display:none;
}

/* INTRO */
#intro {
  height:100vh;
  height:100svh;
  min-height:520px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  box-sizing:border-box;
  padding:70px 20px 72px;
}

.intro-content {
  width:100%;
  max-width:960px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-sizing:border-box;
}

.signature {
  display:block;
  width:min(76vw, 640px);
  max-width:100%;
  height:auto;
  object-fit:contain;
  flex:0 0 auto;
  filter:invert(1);
  opacity:0;
  margin:0;
  animation:fadeIn 1.3s forwards, fadeOut 1.1s forwards 2.7s;
}

.signature-subtitle {
  margin:18px 20px 0;
  max-width:700px;
  font-size:clamp(12px, 1.4vw, 17px);
  line-height:1.5;
  letter-spacing:0.5px;
  font-style:italic;
  font-weight:normal;
  color:rgba(255,255,255,0.78);
  opacity:0;
  animation:subtitleFadeIn 1.3s forwards,
             subtitleFadeOut 1.1s forwards 2.7s;
}

@keyframes subtitleFadeIn {
  from {
    opacity:0;
    transform:translateY(8px);
  }

  to {
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes subtitleFadeOut {
  from {
    opacity:1;
  }

  to {
    opacity:0;
  }
}

@keyframes fadeIn {
  to {
    opacity:1;
  }
}

@keyframes fadeOut {
  to {
    opacity:0;
  }
}

/* CONTENUTO */
.main-content {
  opacity:0;
  display:none;
  transition:opacity 1.5s ease;
}

/* SEZIONI */
.section {
  display:none;
  padding-top:100px;
  min-height:100vh;
}

.active { display:block; }

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px,1fr));
  gap:10px;
  padding:40px;
}

/* ITEM */
.item { position:relative; }

/* IMG */
.item img {
  width:100%;
  cursor:pointer;
  transition:transform 0.8s ease;
}

.item:hover img {
  transform:scale(1.06);
}

/* CAPTION */
.caption {
  position:absolute;
  bottom:15px;
  left:15px;
  font-size:13px;
  background:rgba(0,0,0,0.5);
  padding:6px 8px;
}

/* OVERLAY */
#overlay {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

#overlay img {
  max-width:90vw;
  max-height:70vh;
  opacity:1;
  transition:opacity 0.18s ease;
}

#overlay-text {
  margin-top:20px;
  max-width:500px;
  text-align:center;
}

/* PAGINE TESTO */
.page-text {
  text-align:center;
  margin-top:150px;
  font-size:18px;
  opacity:0.6;
}

/* FOOTER GLOBALE */
.global-footer {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  text-align:center;
  font-size:11px;
  opacity:0.5;
  visibility:visible;
  padding:10px 0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(5px);
  letter-spacing:1px;
  z-index:1000;
}

/* BOOKS LAYOUT */
.books-title {
  text-align:center;
  letter-spacing:2px;
  font-size:28px;
  margin:20px 0 60px 0;
}

.books-list {
  max-width:1050px;
  margin:0 auto 120px auto;
  padding:0 28px;
}

.book-row {
  display:grid;
  grid-template-columns:260px 1fr;
  gap:48px;
  align-items:center;
  padding:60px 0;
  border-bottom:1px solid rgba(255,255,255,0.12);
}

.book-row:last-child {
  border-bottom:none;
}

.book-cover-box {
  display:flex;
  justify-content:center;
  align-items:center;
}

.book-cover {
  width:100%;
  max-width:240px;
  max-height:340px;
  object-fit:contain;
  box-shadow:0 24px 60px rgba(0,0,0,0.45);
}

.book-info {
  text-align:left;
}

.book-year {
  font-size:11px;
  letter-spacing:3px;
  opacity:0.45;
  margin:0 0 16px 0;
}

.book-info h2 {
  font-size:28px;
  line-height:1.18;
  font-weight:normal;
  margin:0 0 14px 0;
}

.book-meta {
  font-size:13px;
  letter-spacing:1px;
  opacity:0.65;
  margin:0 0 22px 0;
}

.book-description {
  max-width:620px;
  font-size:14px;
  line-height:1.7;
  opacity:0.78;
  margin:0 0 28px 0;
}

.book-actions {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.book-button {
  border:1px solid rgba(255,255,255,0.55);
  background:transparent;
  color:white;
  padding:10px 18px;
  font-size:11px;
  letter-spacing:2px;
  text-decoration:none;
  cursor:pointer;
  font-family:Arial;
}

.book-button:hover {
  background:white;
  color:black;
}

/* BOOK READER OVERLAY */
#overlay.book-mode {
  padding:48px 0;
  box-sizing:border-box;
}

#overlay.book-mode #overlay-img {
  display:none;
}

#overlay.book-mode #overlay-text {
  width:min(920px, 90vw);
  max-width:none;
  max-height:86vh;
  margin-top:0;
  overflow-y:auto;
  text-align:left;
}

.book-reader {
  background:#050505;
  border:1px solid rgba(255,255,255,0.14);
  padding:46px;
  box-sizing:border-box;
  line-height:1.75;
  font-size:15px;
}

.book-reader-header {
  text-align:center;
  margin-bottom:55px;
}

.book-reader-cover {
  max-width:240px;
  max-height:340px;
  object-fit:contain;
  margin:0 auto 32px auto;
  display:block;
  box-shadow:0 24px 60px rgba(0,0,0,0.55);
}

.book-reader h2 {
  font-size:30px;
  line-height:1.2;
  font-weight:normal;
  margin:0 0 14px 0;
}

.book-reader h3 {
  font-size:18px;
  font-weight:normal;
  letter-spacing:1px;
  margin:52px 0 20px 0;
}

.book-reader h4 {
  font-size:14px;
  font-weight:normal;
  letter-spacing:2px;
  text-transform:uppercase;
  margin:46px 0 18px 0;
}

.book-reader-meta {
  opacity:0.62;
  font-size:13px;
  letter-spacing:1px;
  margin:0;
}

.book-reader p {
  margin:0 0 20px 0;
}

.poem {
  white-space:pre-line;
  line-height:1.95;
  font-size:15px;
  margin:18px 0 42px 0;
}

.note {
  opacity:0.75;
  font-size:13px;
}

.book-reader-actions {
  display:flex;
  justify-content:center;
  gap:14px;
  margin:34px 0 0 0;
  flex-wrap:wrap;
}

.book-close {
  position:sticky;
  top:0;
  float:right;
  border:1px solid rgba(255,255,255,0.35);
  background:black;
  color:white;
  padding:8px 12px;
  font-size:10px;
  letter-spacing:2px;
  cursor:pointer;
  z-index:2;
}

.book-close:hover {
  background:white;
  color:black;
}

.book-separator {
  height:1px;
  background:rgba(255,255,255,0.14);
  margin:52px 0;
}

.polaroid-gallery {
  display:grid;
  grid-template-columns:1fr;
  gap:52px;
  margin-top:30px;
}

.polaroid-frame {
  margin:0;
  text-align:center;
}

.polaroid-frame img {
  width:min(680px, 100%);
  max-height:78vh;
  object-fit:contain;
  display:block;
  margin:0 auto;
  cursor:zoom-in;
}

.polaroid-frame figcaption {
  margin-top:12px;
  font-size:11px;
  letter-spacing:1px;
  opacity:0.45;
}

/* POLAROID VIEWER */
#polaroid-viewer {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.97);
  z-index:10000;
  align-items:center;
  justify-content:center;
  padding:28px;
  box-sizing:border-box;
}

#polaroid-viewer img {
  max-width:94vw;
  max-height:92vh;
  object-fit:contain;
}

.polaroid-viewer-close {
  position:fixed;
  top:22px;
  right:24px;
  border:1px solid rgba(255,255,255,0.5);
  background:black;
  color:white;
  padding:9px 14px;
  font-size:10px;
  letter-spacing:2px;
  cursor:pointer;
  z-index:10001;
}

.polaroid-viewer-close:hover {
  background:white;
  color:black;
}

/* CONTACT */
.contact-shell {
  min-height:calc(100vh - 180px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px 100px;
  box-sizing:border-box;
}

.contact-card {
  width:min(760px, 100%);
  text-align:center;
  padding:64px 42px;
  box-sizing:border-box;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(0,0,0,0.28);
}

.contact-kicker {
  margin:0 0 20px;
  font-size:10px;
  letter-spacing:4px;
  opacity:0.48;
}

.contact-card h1 {
  margin:0 0 24px;
  font-size:clamp(30px, 5vw, 56px);
  line-height:1.08;
  font-weight:normal;
}

.contact-copy {
  max-width:580px;
  margin:0 auto 34px;
  font-size:14px;
  line-height:1.75;
  opacity:0.72;
}

.contact-links {
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.contact-link {
  display:inline-block;
  min-width:130px;
  padding:12px 18px;
  border:1px solid rgba(255,255,255,0.55);
  color:white;
  text-decoration:none;
  font-size:10px;
  letter-spacing:2px;
  box-sizing:border-box;
}

.contact-link:hover {
  background:white;
  color:black;
}

@media (max-width:760px) {
  .contact-card {
    padding:48px 24px;
  }

  .contact-links {
    flex-direction:column;
    align-items:stretch;
  }

  .contact-link {
    width:100%;
  }
}

/* ENGLISH POETRY */
.english-poetry-shell {
  max-width:1000px;
  margin:60px auto 140px auto;
  padding:0 24px;
}

.english-poetry-layout {
  display:grid;
  grid-template-columns:minmax(0, 680px) minmax(180px, 220px);
  gap:36px;
  align-items:start;
  justify-content:center;
}

.english-poetry-content {
  width:100%;
}

.english-poetry-header {
  text-align:center;
  margin:0 0 76px 0;
}

.english-poetry-header p {
  margin:0;
  font-size:14px;
  line-height:1.6;
  opacity:0.72;
}

.english-poetry-list {
  width:100%;
}

.poem-entry {
  margin:0 0 112px 0;
  padding:0 0 108px 0;
  border-bottom:1px solid rgba(255,255,255,0.14);
  scroll-margin-top:84px;
}

.poem-entry:last-child {
  margin-bottom:0;
  padding-bottom:0;
  border-bottom:0;
}

.poem-title {
  margin:0 0 32px 0;
  text-align:left;
  font-size:17px;
  line-height:1.4;
  font-weight:normal;
}

.poem-credit {
  margin:-24px 0 32px 0;
  text-align:left;
  font-size:13px;
  line-height:1.5;
  font-style:italic;
  opacity:0.68;
}

.poem-text {
  margin:0;
  text-align:left;
  white-space:pre-line;
  font-size:16px;
  line-height:1.72;
  opacity:0.86;
}

/* POEM ARCHIVE */
.poetry-archive {
  width:100%;
  border:1px solid rgba(255,255,255,0.16);
  background:rgba(0,0,0,0.32);
}

.poetry-archive-toggle {
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border:0;
  background:transparent;
  color:white;
  padding:14px 14px;
  font-family:Arial;
  font-size:10px;
  letter-spacing:2px;
  text-align:left;
  cursor:pointer;
}

.poetry-archive-toggle:focus-visible,
.poetry-archive-list a:focus-visible {
  outline:1px solid white;
  outline-offset:3px;
}

.poetry-archive-indicator {
  flex:0 0 auto;
  font-size:14px;
  line-height:1;
  opacity:0.72;
}

.poetry-archive-list {
  border-top:1px solid rgba(255,255,255,0.12);
  padding:8px 0;
}

.poetry-archive-list[hidden] {
  display:none;
}

.poetry-archive-list a {
  display:block;
  color:white;
  padding:10px 14px;
  font-size:11px;
  line-height:1.45;
  letter-spacing:1px;
  text-decoration:none;
  opacity:0.72;
}

.poetry-archive-list a:hover {
  opacity:1;
}

@media (max-width:900px) {
  .english-poetry-layout {
    display:flex;
    flex-direction:column;
    gap:46px;
  }

  .english-poetry-content {
    order:2;
  }

  .poetry-archive {
    order:1;
  }
}

@media (max-width:760px) {
  .english-poetry-shell {
    margin:52px auto 120px auto;
    padding:0 22px;
  }

  .english-poetry-header {
    margin-bottom:62px;
  }

  .poem-entry {
    margin-bottom:96px;
    padding-bottom:92px;
  }

  .poem-title {
    font-size:16px;
  }

  .poem-text {
    font-size:15px;
    line-height:1.7;
  }
}

/* PRIVATE ADMIN LINK */
#private-admin-link {
  display:none;
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:9999;
  border:1px solid rgba(255,255,255,0.35);
  background:rgba(0,0,0,0.82);
  color:white;
  padding:9px 12px;
  font-size:10px;
  letter-spacing:2px;
  text-decoration:none;
}
#private-admin-link:hover {
  background:white;
  color:black;
}

@media (max-width:768px) {
  nav {
    box-sizing:border-box;
    min-height:44px;
  }

  nav > a {
    display:none;
  }

  .mobile-nav-toggle {
    position:absolute;
    top:50%;
    right:16px;
    width:34px;
    height:30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:0;
    border:1px solid rgba(255,255,255,0.45);
    background:transparent;
    color:white;
    cursor:pointer;
  }

  .mobile-nav-toggle span {
    display:block;
    width:18px;
    height:1px;
    background:white;
  }

  .mobile-nav-toggle:focus-visible,
  .mobile-nav-menu a:focus-visible {
    outline:1px solid white;
    outline-offset:3px;
  }

  .mobile-nav-menu {
    position:fixed;
    top:44px;
    left:0;
    right:0;
    z-index:1001;
    display:none;
    padding:8px 0;
    box-sizing:border-box;
    background:rgba(0,0,0,0.94);
    text-align:center;
  }

  .mobile-nav-menu.is-open {
    display:block;
  }

  .mobile-nav-menu a {
    display:block;
    width:100%;
    border:0;
    background:transparent;
    color:white;
    padding:14px 20px;
    font-family:Arial;
    font-size:12px;
    cursor:pointer;
    opacity:0.82;
    text-decoration:none;
    box-sizing:border-box;
  }

  .mobile-nav-menu a:hover {
    opacity:1;
  }
}

@media (max-width:760px) {
  .book-row {
    grid-template-columns:1fr;
    gap:26px;
    padding:46px 0;
  }

  .book-info {
    text-align:center;
  }

  .book-description {
    margin-left:auto;
    margin-right:auto;
  }

  .book-actions {
    justify-content:center;
  }

  .book-reader {
    padding:30px 22px;
  }
}

/* IMAGE PROTECTION AND COPYRIGHT */
img {
  -webkit-user-drag:none;
  user-drag:none;
  -webkit-touch-callout:none;
  user-select:none;
}

#others .item,
#colours .item {
  position:relative;
  overflow:hidden;
  line-height:0;
}

#others .item img,
#colours .item img {
  position:relative;
  z-index:1;
  display:block;
  width:100%;
}

#others .item::after,
#colours .item::after {
  content:"©";
  position:absolute;
  right:10px;
  bottom:10px;
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  font-size:11px;
  line-height:1;
  color:rgba(255,255,255,0.95);
  background:rgba(0,0,0,0.62);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:50%;
  pointer-events:none;
  z-index:80;
}

#others .item .caption,
#colours .item .caption {
  z-index:20;
  line-height:normal;
}

<script>
function getMobileNavElements(){
  return {
    toggle: document.getElementById("mobile-nav-toggle"),
    menu: document.getElementById("mobile-nav-menu")
  };
}

function setMobileMenuOpen(isOpen){
  const nav = getMobileNavElements();
  if (!nav.toggle || !nav.menu) return;

  nav.toggle.setAttribute("aria-expanded", String(isOpen));
  nav.menu.hidden = !isOpen;
  nav.menu.classList.toggle("is-open", isOpen);
}

function closeMobileMenu(){
  setMobileMenuOpen(false);
}

function toggleMobileMenu(){
  const nav = getMobileNavElements();
  if (!nav.toggle || !nav.menu) return;

  setMobileMenuOpen(nav.toggle.getAttribute("aria-expanded") !== "true");
}

document.addEventListener("click", function(event){
  const nav = getMobileNavElements();
  if (!nav.toggle || !nav.menu || nav.menu.hidden) return;
  if (nav.toggle.contains(event.target) || nav.menu.contains(event.target)) return;

  closeMobileMenu();
});

document.addEventListener("keydown", function(event){
  if (event.key === "Escape") {
    closeMobileMenu();
  }
});

window.addEventListener("resize", function(){
  if (window.innerWidth > 768) {
    closeMobileMenu();
  }
});
</script>
<script>
function openImg(img){
  const overlay = document.getElementById("overlay");
  const overlayImg = document.getElementById("overlay-img");
  const text = document.getElementById("overlay-text");
  const src = img.currentSrc || img.src;

  overlayImg.style.opacity = "0";
  overlayImg.onload = function(){
    overlay.style.display = "flex";
    overlayImg.style.opacity = "1";
  };
  overlayImg.onerror = function(){
    overlay.style.display = "none";
    overlayImg.style.opacity = "1";
  };
  overlayImg.src = src;
  if (overlayImg.complete && overlayImg.naturalWidth > 0) {
    overlay.style.display = "flex";
    overlayImg.style.opacity = "1";
  }

  const file = src.split("/").pop().replace(/\.[^.]+$/, "");

  if(file === "9"){
    text.innerHTML = `We sit next to each other, yet remain miles apart.<br><br>Skin brushes against skin and nothing happens.<br><br>Each of us carries our own silence.`;
  }
  else if(file === "10"){
    text.innerHTML = `An empty bench can hurt more than a person who leaves.<br><br>One side carries weight, the other hides.`;
  }
  else if(file === "c13"){
    text.innerHTML = `Not photographs. Human remains.`;
  }
  else{
    text.innerHTML = "";
  }
}

function preloadGalleryImages(){
  return;
}

document.addEventListener("DOMContentLoaded", preloadGalleryImages);

function closeImg(){
  const overlay = document.getElementById("overlay");
  const overlayImg = document.getElementById("overlay-img");
  const text = document.getElementById("overlay-text");

  overlay.style.display = "none";
  overlay.classList.remove("book-mode");
  overlayImg.onload = null;
  overlayImg.onerror = null;
  overlayImg.style.display = "";
  overlayImg.style.opacity = "1";
  overlayImg.src = "";
  text.innerHTML = "";
}
</script>

<script>
(function(){
  function isProtectedImage(target) {
    return target && target.tagName && target.tagName.toLowerCase() === "img";
  }

  document.addEventListener("contextmenu", function(event) {
    if (isProtectedImage(event.target)) {
      event.preventDefault();
    }
  });

  document.addEventListener("dragstart", function(event) {
    if (isProtectedImage(event.target)) {
      event.preventDefault();
    }
  });

  document.addEventListener("mousedown", function(event) {
    if (isProtectedImage(event.target) && event.button === 2) {
      event.preventDefault();
    }
  });

  document.querySelectorAll("img").forEach(function(img){
    img.setAttribute("draggable", "false");
    img.setAttribute("oncontextmenu", "return false");
  });
})();
</script>
